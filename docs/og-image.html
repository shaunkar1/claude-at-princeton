<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude@Princeton social card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500&family=Source+Serif+4:wght@400;600&display=block">
<style>
  html, body { margin: 0; }
  body { box-sizing: border-box; width: 1200px; height: 630px; padding: 72px 80px 64px; display: flex; flex-direction: column; justify-content: space-between; background: #FAF9F5; color: #141413; font-family: Inter, system-ui, sans-serif; }
  .mark { display: flex; align-items: center; gap: 16px; font: 600 34px/1 "Source Serif 4", Georgia, serif; }
  .dot { width: 26px; height: 26px; border-radius: 50%; background: #D97757; }
  h1 { margin: 0; max-width: 15ch; font: 400 86px/1.04 "Source Serif 4", Georgia, serif; letter-spacing: -0.02em; }
  .accent { color: #B8532F; }
  .foot { display: flex; justify-content: space-between; padding-top: 28px; border-top: 2px solid #E8E4DA; color: #4A4943; font-size: 24px; font-weight: 500; letter-spacing: 0.01em; }
</style>
</head>
<body>
  <div class="mark"><span class="dot"></span>Claude@Princeton</div>
  <h1>What Princeton is building with <span class="accent">Claude</span></h1>
  <div class="foot"><span>Claude Builder Club · Princeton University</span><span>claudeatprinceton.org</span></div>
</body>
</html>
