<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join Claude@Princeton</title>
<meta name="description" content="Sign up for Claude@Princeton, Princeton's Claude Builder Club.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FAF9F5">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<style>
:root {
  --ivory: #FAF9F5;
  --ink: #141413;
  --ink-2: #4A4943;
  --clay: #D97757;
  --clay-deep: #B8532F;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--ivory); color: var(--ink-2); font: 400 18px/1.5 var(--sans); text-align: center; }
:focus-visible { outline: 2px solid var(--clay-deep); outline-offset: 3px; }
.mark { display: inline-flex; align-items: center; gap: 10px; margin: 0; color: var(--ink); font: 600 22px/1 var(--serif); }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--clay); }
h1 { margin: 28px 0 8px; color: var(--ink); font: 400 clamp(32px, 6vw, 44px)/1.1 var(--serif); letter-spacing: -0.01em; }
a { color: var(--ink); text-underline-offset: 4px; }
a:hover { color: var(--clay-deep); }
.btn { display: inline-flex; align-items: center; min-height: 44px; margin-top: 16px; padding: 0 22px; border-radius: 999px; background: var(--ink); color: var(--ivory); font-weight: 500; text-decoration: none; }
.btn:hover { background: var(--ink-2); color: var(--ivory); }
.back { display: inline-flex; align-items: center; min-height: 44px; margin-top: 12px; font-size: 16px; }
</style>
</head>
<body>
<main>
  <p class="mark"><span class="dot" aria-hidden="true"></span>Claude@Princeton</p>
  <h1 id="message">Taking you to the sign-up form…</h1>
  <a class="btn" id="form-link" href="../index.html#about">Open the sign-up form</a>
  <br>
  <a class="back" href="../index.html">Back to the site</a>
</main>
<script>
  // The club's sign-up form. This is the only place its URL lives: the site's "Join" buttons,
  // the short link (claudeatprinceton.org/join) and the tabling QR code all come through here,
  // so switching to a new form never breaks a printed QR code.
  const JOIN_FORM_URL = "TODO_JOIN_FORM_URL";

  if (/^https:\/\//.test(JOIN_FORM_URL)) {
    document.getElementById("form-link").href = JOIN_FORM_URL;
    location.replace(JOIN_FORM_URL);
  } else {
    document.getElementById("message").textContent = "The sign-up form opens soon";
    document.getElementById("form-link").hidden = true;
  }
</script>
</body>
</html>
